<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FINAUTO</title>
<meta name="description" content="Routine survival automation — time + money + freedom">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09);
  --txt:#eef0ff; --mut:#8e92b4; --v:#8b5cf6; --c:#22d3ee; --p:#f472b6; --g:#34d399; --y:#fbbf24; --r:#fb7185;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#22d3ee 100%);
  --grad2:linear-gradient(135deg,#f472b6 0%,#8b5cf6 100%);
  --rad:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:var(--c)}
/* aurora background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);opacity:.28;animation:float 22s ease-in-out infinite alternate}
.bg .b1{background:#7c3aed;top:-20vmax;left:-15vmax}
.bg .b2{background:#0891b2;bottom:-25vmax;right:-15vmax;animation-delay:-7s}
.bg .b3{background:#db2777;top:30%;left:45%;width:35vmax;height:35vmax;opacity:.16;animation-delay:-13s}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.1)}100%{transform:translate(-4vmax,7vmax) scale(.95)}}

.app{position:relative;z-index:1;display:flex;min-height:100vh}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line);background:rgba(8,8,18,.45);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 30px rgba(139,92,246,.55)}
.logo b{font-family:'Space Grotesk';font-size:21px;letter-spacing:.06em}
.logo small{display:block;color:var(--mut);font-size:11px;letter-spacing:.04em;margin-top:1px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:none;cursor:pointer;color:var(--mut);font-weight:500;font-size:14.5px;text-align:left;transition:.2s}
.nav .ic{font-size:17px;width:22px;text-align:center}
.nav:hover{background:var(--card);color:var(--txt)}
.nav.on{background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(34,211,238,.12));color:var(--txt);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.side .foot{margin-top:auto;color:var(--mut);font-size:11.5px;padding:10px 14px;line-height:1.5}

main{flex:1;min-width:0;padding:30px clamp(16px,3.2vw,44px) 130px;max-width:1240px;margin:0 auto}
.bottom{display:none}

/* type */
h1{font-family:'Space Grotesk';font-size:clamp(26px,3.4vw,38px);margin:4px 0 0;letter-spacing:-.02em;line-height:1.1}
h2{font-family:'Space Grotesk';font-size:18px;margin:0 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h3{font-size:14px;margin:0 0 8px}
.gt{background:linear-gradient(90deg,#c4b5fd,#67e8f9 60%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.num{font-family:'Space Grotesk';font-weight:700;letter-spacing:-.02em}
.g{color:var(--g)} .y{color:var(--y)} .r{color:var(--r)} .c{color:var(--c)} .pk{color:var(--p)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top p{margin:8px 0 0;color:var(--mut);max-width:620px;line-height:1.5}
.topr{display:flex;gap:8px;flex-wrap:wrap}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);min-width:0}
.anim .card,.anim .stat{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
@media(max-width:600px){.g4{grid-template-columns:1fr 1fr;gap:12px}.stat .v{font-size:22px}.card{padding:16px}.stat .lbl{font-size:10.5px}}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr))}
.stat{position:relative;overflow:hidden}
.stat .v{font-size:30px;margin:8px 0 4px}
.stat .glow{position:absolute;width:140px;height:140px;border-radius:50%;filter:blur(50px);opacity:.35;right:-40px;top:-40px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.tag.g{color:var(--g);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.tag.y{color:var(--y);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.tag.r{color:var(--r);border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.08)}
.tag.pu{color:#c4b5fd;border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.1)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;padding:28px;margin-bottom:16px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(139,92,246,.7),rgba(34,211,238,.35),rgba(244,114,182,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.mega{font-family:'Space Grotesk';font-weight:700;font-size:clamp(52px,7vw,84px);line-height:1;letter-spacing:-.04em;margin:10px 0 6px;background:linear-gradient(180deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.mega small{font-size:.4em;margin-left:6px;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.rings{display:flex;justify-content:space-around;align-items:center;gap:10px;flex-wrap:wrap}
.ringbox{position:relative;display:grid;place-items:center;text-align:center}
.ringbox .in{position:absolute;inset:0;display:grid;place-content:center}
.ringbox .in b{font-family:'Space Grotesk';font-size:22px}
.ringbox .in span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ringbox .cap{margin-top:8px;font-size:12px;color:var(--mut);max-width:130px}
.ring .arc{stroke-dashoffset:var(--off);filter:drop-shadow(0 0 6px rgba(139,92,246,.6))}
.anim .ring .arc{animation:ringin 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--off)}}

/* week bar */
.week{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:18px 0 10px;background:rgba(255,255,255,.06)}
.week i{display:block;height:100%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--k);margin-right:6px;vertical-align:-1px}

/* bars */
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:inherit;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.anim .bar>i{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}
.vb{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.vb .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.vb .well{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.vb .b{width:min(34px,70%);border-radius:10px 10px 4px 4px;min-height:3px;transition:height 1s}
.anim .vb .b{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{height:0!important}}
.vb .mark{position:absolute;left:8%;right:8%;border-top:2px dashed rgba(255,255,255,.55)}
.vb .t{font-size:11px;color:var(--mut)} .vb .val{font-size:10.5px;color:var(--txt);font-weight:600}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ic{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--card2)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12.5px;color:var(--mut)}
.row .end{text-align:right;flex:none}
.empty{color:var(--mut);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(251,113,133,.12),rgba(251,113,133,.03));border:1px solid rgba(251,113,133,.25);font-size:14px}
.alert.y{background:linear-gradient(90deg,rgba(251,191,36,.12),rgba(251,191,36,.03));border-color:rgba(251,191,36,.25)}
.alert.v{background:linear-gradient(90deg,rgba(139,92,246,.16),rgba(34,211,238,.05));border-color:rgba(139,92,246,.3)}
.alert .ic{font-size:20px}
.alert .t{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--grad);border:0;color:#fff;padding:10px 16px;border-radius:13px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 24px -8px rgba(139,92,246,.7);white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(139,92,246,.9)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.red{background:linear-gradient(135deg,#fb7185,#e11d48)}
.btn.grn{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 8px 24px -8px rgba(52,211,153,.6)}
.btn.wide{width:100%;padding:14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
.chip:hover{border-color:rgba(139,92,246,.5)}
.chip.on{background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(34,211,238,.2));border-color:rgba(139,92,246,.7);box-shadow:0 0 18px -4px rgba(139,92,246,.7)}
input,select,textarea{background:rgba(255,255,255,.055);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 12px;font:inherit;font-size:14px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus{border-color:rgba(139,92,246,.7);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
select option{background:#141426;color:var(--txt)}
input[type=date]{color-scheme:dark}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);font-weight:500;min-width:0}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.12);cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--grad)}
.sw input:checked+span::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:16px}
.stepper b{min-width:62px;text-align:center;font-family:'Space Grotesk'}
.mood{display:flex;gap:10px;flex-wrap:wrap}
.mood button{font-size:30px;width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:var(--card2);cursor:pointer;transition:.2s;filter:grayscale(.7);opacity:.6}
.mood button.on{filter:none;opacity:1;transform:scale(1.1);border-color:rgba(139,92,246,.8);box-shadow:0 0 24px -4px rgba(139,92,246,.8)}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:16px 0}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--r);background:rgba(251,113,133,.1)}

.fab{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:28px;z-index:20;width:64px;height:64px;border-radius:22px;border:0;background:var(--grad);color:#fff;font-size:32px;cursor:pointer;box-shadow:0 14px 40px -8px rgba(139,92,246,.9),0 0 0 6px rgba(139,92,246,.12);transition:transform .2s}
.fab:hover{transform:rotate(90deg) scale(1.05)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(3,3,10,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#modal.open{display:flex}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#15152a,#0d0d1c);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:sheet .35s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:28px}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.amt{font-family:'Space Grotesk';font-size:44px;font-weight:700;text-align:center;background:transparent;border:0;box-shadow:none!important;padding:6px 0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:15px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:11.5px;color:var(--mut);transition:.15s}
.catgrid button span{font-size:24px}
.catgrid button.on{color:var(--txt);border-color:var(--k);background:color-mix(in srgb,var(--k) 22%,transparent);box-shadow:0 0 22px -6px var(--k)}
.sec{font-size:12px;color:var(--mut);margin:16px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#1b1b33;border:1px solid rgba(139,92,246,.5);padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;pointer-events:none;box-shadow:0 10px 40px -10px rgba(139,92,246,.8)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.banner{display:flex;gap:18px;align-items:center;padding:16px 20px;margin-bottom:16px}
.banner .bar{flex:1}
.pillbar{display:flex;gap:6px;overflow:auto;margin-bottom:16px;scrollbar-width:none}
.task{display:grid;gap:12px}
.task .head{display:flex;gap:10px;align-items:center}
.verdict{font-size:12.5px;padding:8px 12px;border-radius:11px;background:var(--card2)}
.rank{font-family:'Space Grotesk';font-size:13px;width:28px;height:28px;border-radius:9px;background:var(--grad);display:grid;place-items:center;flex:none}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 6px;text-align:left;border-top:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}

@media(max-width:900px){
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;gap:2px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(8,8,18,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);scrollbar-width:none}
  .bottom::-webkit-scrollbar{display:none}
  .bottom .nav{flex-direction:column;gap:3px;padding:7px 10px;font-size:10.5px;min-width:64px;align-items:center}
  .bottom .nav .ic{font-size:19px}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px}
  main{padding-top:20px;padding-bottom:170px}
  .hero{grid-template-columns:1fr;padding:22px}
  .mob-logo{display:flex!important}
}
.tpill{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:25;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:99px;border:1px solid rgba(34,211,238,.5);background:rgba(12,14,30,.9);backdrop-filter:blur(16px);color:var(--txt);font-size:14px;cursor:pointer;box-shadow:0 10px 30px -8px rgba(34,211,238,.6)}
.tpill b{font-family:'Space Grotesk';font-variant-numeric:tabular-nums}
.tpill .dot{width:9px;height:9px;border-radius:50%;background:var(--r);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media(max-width:900px){.tpill{bottom:calc(92px + env(safe-area-inset-bottom))}}
.mob-logo{display:none;align-items:center;gap:10px;margin-bottom:14px}
.mob-logo .mark{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center}
.mob-logo b{font-family:'Space Grotesk';letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><div><b>FINAUTO</b><small>time · money · freedom</small></div></div>
    <div id="sidenav"></div>
    <div class="foot">Data stays on this device.<br>Back up from Settings → Export.</div>
  </aside>
  <main id="main"></main>
</div>
<nav class="bottom" id="botnav"></nav>
<button class="fab" data-act="quick" aria-label="Quick add expense">+</button>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
/* =============== FINAUTO v1 =============== */
const KEY='finauto.v1';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const mk=s=>s.slice(0,7);
const dim=k=>new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
const monthsBack=n=>{const out=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}return out};

const num=n=>Math.round(n||0).toLocaleString('en-IN');

const CATS={food:{n:'Food & groceries',e:'🍛',c:'#f59e0b'},work:{n:'Work & commute',e:'🚌',c:'#22d3ee'},home:{n:'Home & bills',e:'🏠',c:'#8b5cf6'},body:{n:'Body & sleep',e:'💪',c:'#34d399'}};
const MISC={outing:{n:'Outing with friends',e:'🍽️',c:'#f472b6'},emergency:{n:'Emergency',e:'🆘',c:'#fb7185'},gift:{n:'Gifts & occasions',e:'🎁',c:'#fbbf24'},repair:{n:'Repair / medical / fine',e:'🔧',c:'#60a5fa'},friend:{n:'Friend money written off',e:'🤝',c:'#a78bfa'},other:{n:'Other',e:'❓',c:'#94a3b8'}};
const MISCB={n:'Unexpected / misc',e:'⚡',c:'#f472b6'};
const BCATS=['food','work','home','body','misc'];
const binfo=k=>CATS[k]||MISCB;
const info=k=>CATS[k]||MISC[k]||MISCB;
const bucket=k=>CATS[k]?k:'misc';
const FEEL={enjoy:{e:'😊',n:'Enjoy',w:0},neutral:{e:'😐',n:'Neutral',w:1},drain:{e:'😩',n:'Drains me',w:3}};
const FIX={none:'— No fix yet',pay:'💳 Pay for it',delegate:'👨‍👩‍👦 Delegate to family',batch:'📦 Batch it',reminder:'🔔 Reminder / auto-pay'};

const FST={toreturn:{n:'To return',e:'🔁',k:'pu'},unsure:{n:'Unsure',e:'❔',k:'y'},returned:{n:'Returned',e:'✅',k:'g'},written:{n:'Written off',e:'❌',k:'r'}};

];
const DEF=()=>({v:1,created:today(),settings:{name:'Maier',salary:0,salaryCur:'KWD',savings:0,savingsCur:'INR',workHours:10,defCur:'KWD',trip:{on:false,country:'',cur:'USD',id:null}},
 rates:{INR:1,KWD:290,USD:88,AED:24,SAR:23.5,EUR:102},passive:[],tasks:defTasks(),reviews:{},expenses:[],friends:[],bills:[],budgets:{},budgetHist:{},alloc:{savings:0,family:0,growth:0},sessions:[],timer:null,trips:[],lastNotify:''});

let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?Object.assign(DEF(),JSON.parse(r)):DEF()}catch(e){S=DEF()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const rate=c=>+S.rates[c]||1;
const toINR=(a,c)=>(+a||0)*rate(c);

/* ---------- calculations ---------- */
function firstDay(){let d=S.created;S.expenses.forEach(e=>{if(e.date<d)d=e.date});Object.keys(S.reviews).forEach(k=>{if(k<d)d=k});return d}
function pastMonths(){const fd=firstDay();return monthsBack(4).slice(0,3).filter(k=>k+'-01'>=fd)}
function remaining(f){return f.inr-(f.returned||[]).reduce((a,r)=>a+r.inr,0)}
function spendMonth(k){
  const o={food:0,work:0,home:0,body:0,misc:0,total:0,byType:{}};
  S.expenses.forEach(e=>{if(mk(e.date)!==k)return;const b=bucket(e.cat);o[b]+=e.inr;o.total+=e.inr;if(b==='misc')o.byType[e.cat]=(o.byType[e.cat]||0)+e.inr});
  S.friends.forEach(f=>{if(f.state==='written'&&f.writtenDate&&mk(f.writtenDate)===k){const v=remaining(f);o.misc+=v;o.total+=v;o.byType.friend=(o.byType.friend||0)+v}});
  return o;
}
function billNext(b){
  const t=today(),now=parse(t);
  if(b.repeat==='yearly'){
    let y=now.getFullYear(),key=String(y);
    const mkd=yy=>iso(new Date(yy,(+b.dueMonth||1)-1,Math.min(+b.dueDay||1,dim(yy+'-'+pad(+b.dueMonth||1)))));
    if((b.paid&&b.paid[key])||diffDays(t,mkd(y))<-31){y++;key=String(y)}
    const date=mkd(y);return{date,key,days:diffDays(t,date)};
  }
  let y=now.getFullYear(),m=now.getMonth()+1,key=y+'-'+pad(m);
  if(b.paid&&b.paid[key]){m++;if(m>12){m=1;y++}key=y+'-'+pad(m)}
  const date=y+'-'+pad(m)+'-'+pad(Math.min(+b.dueDay||1,dim(key)));
  return{date,key,days:diffDays(t,date)};
}
function budgetStats(M){
  const past=pastMonths().map(k=>({k,s:spendMonth(k)})).filter(x=>x.s.total>0);
  const cur=M.cm, dn=new Date().getDate(), dm=dim(M.ck);
  const o={};
  BCATS.forEach(c=>{
    const vals=past.map(x=>x.s[c]);
    const last=past.length?past[past.length-1].s[c]:0;
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:cur[c]/dn*dm;
    const hi=vals.length?Math.max(...vals):0;
    const sug=Math.max(100,Math.ceil(avg/100)*100);
    const bud=+S.budgets[c]||0, spent=cur[c];
    const pct=bud?spent/bud:0;
    const daysLeft=dm-dn+1;
    o[c]={last,avg,hi,sug,bud,spent,pct,rem:bud-spent,safe:bud?Math.max(0,(bud-spent)/daysLeft):0,hasPast:vals.length>0};
  });
  return o;
}
function calc(){
  const t=today(),s=S.settings;
  const fd=firstDay(),dataDays=Math.max(1,diffDays(fd,t)+1),discovery=dataDays<30;
  const ck=mk(t),cm=spendMonth(ck);
  const from=addDays(t,-29);let surv30=0;
  S.expenses.forEach(e=>{if(e.date>=from&&e.date<=t&&CATS[e.cat])surv30+=e.inr});
  const survival=surv30*30/Math.min(30,dataDays);
  const past=pastMonths().map(spendMonth).filter(x=>x.total>0);
  const dn=new Date().getDate();
  const miscAvg=past.length?past.reduce((a,x)=>a+x.misc,0)/past.length:cm.misc/dn*dim(ck);
  const r7=Object.entries(S.reviews).filter(([k])=>k>=addDays(t,-6)&&k<=t);
  const workWeek=r7.length?r7.reduce((a,[,r])=>a+(+r.work||0),0)/r7.length*7:(+s.workHours||0)*6;
  const base=S.tasks.reduce((a,x)=>a+(+x.min||0),0)*7/60;
  const after=S.tasks.reduce((a,x)=>a+((x.fix.active&&x.fix.type!=='none')?(+x.fix.after||0):(+x.min||0)),0)*7/60;
  const actual=r7.length?r7.reduce((a,[,r])=>a+Object.values(r.mins||{}).reduce((b,v)=>b+(+v||0),0),0)/r7.length*7/60:null;
  const saved=Math.max(0,base-after);
  const freeBefore=168-workWeek-56-base,freeAfter=168-workWeek-56-after;
  const freeActual=actual==null?null:168-workWeek-56-actual;
  const salaryINR=toINR(s.salary,s.salaryCur);
  const hourValue=workWeek>0?salaryINR/(workWeek*4.33):0;
  const passiveINR=S.passive.reduce((a,p)=>a+toINR(p.amount,p.cur),0);
  const coverage=survival>0?passiveINR/survival:0;
  const savingsINR=toINR(s.savings,s.savingsCur);
  const runway=survival>0?savingsINR/survival:0;
  const moods=r7.map(([k,r])=>({k,m:r.mood})).filter(x=>x.m).sort((a,b)=>a.k<b.k?-1:1);
  const M={t,dataDays,discovery,ck,cm,survival,miscAvg,workWeek,base,after,actual,saved,freeBefore,freeAfter,freeActual,salaryINR,hourValue,passiveINR,coverage,savingsINR,runway,moods,r7n:r7.length};
  M.sugg=suggestions(M);M.bs=budgetStats(M);
  return M;
}
function taskEval(x,hv){
  const saveMin=(+x.min||0)-(+x.fix.after||0);
  const hrsMonth=saveMin*30/60;
  const cph=hrsMonth>0?(+x.fix.cost||0)/hrsMonth:Infinity;
  const w=FEEL[x.feel]?.w??1;
  const worth=x.fix.type!=='none'&&hrsMonth>0&&cph<=hv;
  const score=(x.fix.type==='none'||hrsMonth<=0||w===0)?-Infinity:(hv-cph)*w+hrsMonth*w;
  return{hrsMonth,cph,worth,score,w};
}
function suggestions(M){
  return S.tasks.filter(x=>!x.fix.active&&x.feel!=='enjoy'&&x.fix.type!=='none').map(x=>({x,...taskEval(x,M.hourValue)})).filter(o=>o.score>-Infinity&&o.worth).sort((a,b)=>b.score-a.score);
}
function alerts(M){
  const out=[],t=M.t;
  S.bills.forEach(b=>{const n=billNext(b);if(n.days<=(+b.warn||3))out.push({k:n.days<0?'r':'y',ic:'🔔',t:`<b>${esc(b.name)}</b> ${n.days<0?'overdue by '+(-n.days)+' d':n.days===0?'due today':'due in '+n.days+' d'} · ${money(b.amt,b.cur)}`,act:`<button class="btn sm" data-act="billpay" data-id="${b.id}">Mark paid</button>`,notify:`${b.name} ${n.days<=0?'is due':'due in '+n.days+' days'} — ${money(b.amt,b.cur)}`})});
  S.friends.forEach(f=>{if(f.state!=='toreturn'||!f.due)return;const d=diffDays(f.due,t);if(d>=0){const rem=remaining(f)/f.rate;out.push({k:d>0?'r':'y',ic:'🤝',t:`Ask <b>${esc(f.person)}</b> for ${money(rem,f.cur)} ${d>0?`· <span class="r">overdue ${d} d</span>`:'· due today'}`,act:`<button class="btn sm ghost" data-act="go" data-v="friends">Open</button>`,notify:(d===0||d%3===0)?`Ask ${f.person} to return ${money(rem,f.cur)}`:null})}});
  BCATS.forEach(c=>{const b=M.bs[c];if(b.bud&&b.pct>=.8)out.push({k:b.pct>=1?'r':'y',ic:binfo(c).e,t:`${binfo(c).n}: <b>${Math.round(b.pct*100)}%</b> of budget used`,act:`<button class="btn sm ghost" data-act="go" data-v="budget">Budget</button>`})});
  if(M.miscAvg>0&&M.cm.misc>M.miscAvg*1.05)out.push({k:'v',ic:'⚡',t:`Unexpected spending this month (${inr(M.cm.misc)}) is above your average (${inr(M.miscAvg)})`,act:''});
  return out;
}

/* ---------- ui helpers ---------- */
let gid=0,ANIM=true;
function ring(p,inner,c1,c2,size=124,sw=11){
  const r=(size-sw)/2,C=2*Math.PI*r,off=C*(1-clamp(p,0,1)),id='rg'+(++gid),h=size/2;
  return `<div class="ringbox" style="width:${size}px;height:${size}px"><svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="${h}" cy="${h}" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="${sw}" fill="none"/><circle class="arc" cx="${h}" cy="${h}" r="${r}" stroke="url(#${id})" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" style="--c:${C};--off:${off}" transform="rotate(-90 ${h} ${h})"/></svg><div class="in">${inner}</div></div>`;
}
function donut(segs,size=150,sw=18,center=''){
  const r=(size-sw)/2,C=2*Math.PI*r,h=size/2,tot=segs.reduce((a,s)=>a+s.v,0);let acc=0;
  const arcs=tot>0?segs.filter(s=>s.v>0).map(s=>{const d=C*s.v/tot;const el=`<circle cx="${h}" cy="${h}" r="${r}" stroke="${s.c}" stroke-width="${sw}" fill="none" stroke-dasharray="${Math.max(0,d-2)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${h} ${h})"/>`;acc+=d;return el}).join(''):'';
  return `<div class="ringbox" style="width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}"><circle cx="${h}" cy="${h}" r="${r}" stroke="rgba(255,255,255,.07)" stroke-width="${sw}" fill="none"/>${arcs}</svg><div class="in">${center}</div></div>`;
}
function vbars(items,fmt=inr){
  const mx=Math.max(1,...items.map(i=>Math.max(i.v,i.mark||0)));
  return `<div class="vb">${items.map(i=>`<div class="col"><div class="val">${i.v?fmt(i.v):''}</div><div class="well">${i.mark?`<div class="mark" style="bottom:${i.mark/mx*100}%"></div>`:''}<div class="b" style="height:${i.v/mx*100}%;background:${i.c}"></div></div><div class="t">${i.l}</div></div>`).join('')}</div>`;
}
function bar(p,c){return `<div class="bar"><i style="width:${clamp(p,0,1)*100}%;background:${c}"></i></div>`}

const cnt=(v,f='inr')=>`<span class="cnt" data-to="${v}" data-fmt="${f}">${F(v,f)}</span>`;
function F(v,f){return f==='inr'?inr(v):f==='dec1'?(+v).toFixed(1):f==='pct'?Math.round(v)+'%':num(v)}
function runCounters(){if(!ANIM)return;document.querySelectorAll('.cnt').forEach(el=>{const to=+el.dataset.to||0,f=el.dataset.fmt,t0=performance.now(),d=1000;const st=n=>{const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=F(to*e,f);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}

/* --- Daily review --- */

/* --- Timer --- */
const planMin=x=>(x.fix&&x.fix.active&&x.fix.type!=='none')?(+x.fix.after||0):(+x.min||0);
const hms=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+(m%60?pad(m%60)+'m':''):m+'m'};
function timerTargets(){return[{id:'work',name:'Work shift',e:'💼',c:'#22d3ee',plan:(+S.settings.workHours||10)*60},...S.tasks.map(x=>({id:x.id,name:x.name,e:CATS[x.cat].e,c:CATS[x.cat].c,plan:planMin(x)}))]}
const tName=id=>id==='work'?'Work shift':(S.tasks.find(x=>x.id===id)||{name:'Task'}).name;
function dayMins(d,task){return S.sessions.filter(x=>x.date===d&&x.task===task).reduce((a,x)=>a+x.min,0)}
function ensureReview(d){if(!S.reviews[d])S.reviews[d]={date:d,shift:'morning',work:+S.settings.workHours||10,mood:0,mins:Object.fromEntries(S.tasks.map(x=>[x.id,planMin(x)])),auto:true};return S.reviews[d]}
function syncDay(d,task){
  const r=ensureReview(d);r.timed=r.timed||{};const m=dayMins(d,task);
  if(task==='work'){if(m>0)r.work=Math.round(m/60*4)/4;else if(r.timed.work)r.work=+S.settings.workHours||10;r.timed.work=m>0}
  else{const x=S.tasks.find(y=>y.id===task);r.mins[task]=m>0?m:(x?planMin(x):0);r.timed[task]=m>0}
  RV=null;
}
function startTimer(id){if(S.timer)stopTimer(true,true);S.timer={task:id,start:Date.now()};save();toast('⏱️ '+tName(id)+' started');render(false)}
function stopTimer(keep=true,quiet=false){
  const T=S.timer;if(!T)return;S.timer=null;const ms=Date.now()-T.start;
  if(keep&&ms>=30000){const min=Math.max(1,Math.round(ms/60000)),d=iso(new Date(T.start));S.sessions.push({id:uid(),task:T.task,start:T.start,end:Date.now(),date:d,min});syncDay(d,T.task);if(!quiet)toast('✓ '+hm(min)+' added to '+tName(T.task))}
  else if(keep&&!quiet)toast('Under 30 seconds — not saved');
  save();if(!quiet)render(false);
}
V.timer=()=>{
  const M=calc(),t=today(),run=S.timer,tg=timerTargets();

  const rt=ss.filter(s=>s.task!=='work').reduce((a,s)=>a+s.min,0),wt=ss.filter(s=>s.task==='work').reduce((a,s)=>a+s.min,0);
  const planTot=S.tasks.reduce((a,x)=>a+planMin(x),0);
  const from=addDays(t,-6);
  const acc=S.tasks.map(x=>{const se=S.sessions.filter(s=>s.task===x.id&&s.date>=from);const n=new Set(se.map(s=>s.date)).size;return{x,n,avg:n?se.reduce((a,s)=>a+s.min,0)/n:0,plan:planMin(x)}}).filter(o=>o.n>0);
  const pct=cur?el/60/Math.max(1,cur.plan):0;
  return `<header class="top"><div><div class="lbl">Measure, don't guess</div><h1>Task <span class="gt">timer</span></h1><p>Tap a task to start. When you stop, the minutes go straight into today's review, so Home, Automate and your free-hours numbers update themselves.</p></div></header>

      ${run?`<div class="mut">${cur.e} <b style="color:var(--txt)">${esc(cur.name)}</b> · planned ${hm(cur.plan)} · started ${new Date(run.start).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
      <div class="flex" style="margin-top:18px"><button class="btn red" data-act="tstop">■ Stop & save</button><button class="btn ghost" data-act="tdiscard">Discard</button></div>`

    </div>
    <div class="rings"><div id="tring" style="text-align:center">${ring(pct,`<b>${run?Math.round(pct*100)+'%':'—'}</b><span>of plan</span>`,cur?cur.c:'#8b5cf6',pct>1?'#fb7185':'#22d3ee',170,14)}<div class="ringbox"><div class="cap">${run?(pct>1?'over your planned time':'of planned time used'):'start a task'}</div></div></div></div>
  </section>
  <div class="grid g4">
    <div class="card stat" style="--d:1"><div class="glow" style="background:#f59e0b"></div><div class="lbl">Routine timed today</div><div class="v num">${hm(rt)}</div><div class="mut xs">plan ${hm(planTot)} per day</div></div>
    <div class="card stat" style="--d:2"><div class="glow" style="background:#22d3ee"></div><div class="lbl">Work timed today</div><div class="v num">${hm(wt)}</div><div class="mut xs">sets today's work hours</div></div>
    <div class="card stat" style="--d:3"><div class="glow" style="background:#f472b6"></div><div class="lbl">Value of routine time</div><div class="v num">${cnt(rt/60*M.hourValue)}</div><div class="mut xs">today at ${inr(M.hourValue)}/h</div></div>
    <div class="card stat" style="--d:4"><div class="glow" style="background:#34d399"></div><div class="lbl">Free hours / week</div><div class="v num">${cnt(Math.max(0,M.freeActual!=null?M.freeActual:M.freeAfter),'dec1')}<span class="mut sm"> h</span></div><div class="mut xs">last 7 days, incl. timer data</div></div>
  </div>
  <div class="card" style="--d:5;margin-bottom:16px"><h2>▶️ Start a task</h2>
    <div class="grid g4" style="margin:0">${tg.map(x=>{const m=dayMins(t,x.id),on=run&&run.task===x.id;return `<button class="card" data-act="${on?'tstop':'tstart'}" data-v="${x.id}" style="text-align:left;cursor:pointer;padding:16px;${on?`border-color:${x.c};box-shadow:0 0 30px -6px ${x.c}`:''}">
      <div class="between"><span style="font-size:26px">${x.e}</span><span class="tag" style="${on?`color:${x.c};border-color:${x.c}`:''}">${on?'■ stop':'▶ start'}</span></div>
      <b style="display:block;margin:10px 0 4px">${esc(x.name)}</b><div class="mut xs">${hm(m)} of ${hm(x.plan)} today</div>

  <div class="grid g2">
    <div class="card" style="--d:6"><h2>🎯 Estimate vs reality · 7 days</h2><div class="mut xs" style="margin-bottom:6px">Update your estimate and Automate + Home recalculate from real data.</div>
      ${acc.length?acc.map(o=>{const d=o.avg-o.plan;return `<div class="row"><div class="ic">${CATS[o.x.cat].e}</div><div class="mid"><b>${esc(o.x.name)}</b><span>estimate ${o.plan}m · timer ${Math.round(o.avg)}m/day (${o.n} d)</span></div><span class="tag ${Math.abs(d)<5?'g':d>0?'r':'g'}">${d>0?'+':''}${Math.round(d)}m</span>${Math.abs(d)>=5?`<button class="btn sm ghost" data-act="tuse" data-id="${o.x.id}" data-v="${Math.round(o.avg)}">Use ${Math.round(o.avg)}m</button>`:''}</div>`}).join(''):'<div class="empty">Time a few tasks — this compares your guesses with reality.</div>'}</div>
    <div class="card" style="--d:7"><h2>🧾 Today's sessions</h2>
      ${ss.length?ss.map(s=>{const x=tg.find(y=>y.id===s.task)||{e:'⏱️'};return `<div class="row"><div class="ic">${x.e}</div><div class="mid"><b>${esc(tName(s.task))}</b><span>${new Date(s.start).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} – ${new Date(s.end).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="end num">${hm(s.min)}</div><button class="x" data-act="tdel" data-id="${s.id}">×</button></div>`}).join(''):'<div class="empty">No timed sessions today yet.</div>'}</div>
  </div>`;
};
setInterval(()=>{if(!S||!S.timer)return;const s=(Date.now()-S.timer.start)/1000;document.querySelectorAll('.tlive').forEach(e=>e.textContent=hms(s));
  if(VIEW==='timer'){const x=timerTargets().find(y=>y.id===S.timer.task);const p=clamp(s/60/Math.max(1,x?x.plan:60),0,1);const a=document.querySelector('#tring .arc');if(a){const C=+a.style.getPropertyValue('--c');a.style.setProperty('--off',C*(1-p));a.style.animation='none'}const b=document.querySelector('#tring .in b');if(b)b.textContent=Math.round(s/60/Math.max(1,x?x.plan:60)*100)+'%'}},1000);

};

/* --- Budget --- */

    <div class="rings">${ring(tB?tS/tB:0,`<b>${tB?Math.round(tS/tB*100):0}%</b><span>used</span>`,tB&&tS/tB>=1?'#fb7185':'#34d399',tB&&tS/tB>=.8?'#fbbf24':'#22d3ee',150,13)}</div>

    <div class="flex" style="margin:14px 0 10px;gap:8px"><span class="mut xs">₹</span><input type="number" inputmode="numeric" min="0" step="100" data-edit="budgets||${c}|num" value="${b.bud||''}" placeholder="Budget" style="flex:1;font-family:'Space Grotesk';font-size:18px;font-weight:600"><button class="btn sm ghost" data-act="usesug" data-c="${c}" title="Use suggestion">Use ${inr(b.sug)}</button></div>
    ${bar(b.bud?b.pct:0,pctColor(b.pct))}
    <div class="between sm" style="margin-top:10px"><span>Spent <b class="num">${inr(b.spent)}</b></span><span class="${b.rem<0?'r':'mut'}">${b.bud?(b.rem<0?inr(-b.rem)+' over':inr(b.rem)+' left'):'no budget'}</span></div>
    ${b.bud?`<div class="verdict" style="margin-top:10px">🛡️ Safe to spend: <b class="num">${inr(b.safe)}</b>/day for ${dm-dn+1} days</div>`:''}
    <div class="flex" style="margin-top:10px;gap:6px"><span class="tag">last ${inr(b.last)}</span><span class="tag">3-mo avg ${inr(b.avg)}</span><span class="tag">high ${inr(b.hi)}</span></div>

/* --- Allocation --- */
const XB={savings:{n:'Savings',e:'🏦',c:'#a3e635',d:'Builds your runway'},family:{n:'Family / send home',e:'👨‍👩‍👦',c:'#60a5fa',d:'Support to home'},growth:{n:'Growth fund',e:'🚀',c:'#e879f9',d:'Courses, tools, gear for passive income'}};
function allocData(M){
  const income=M.salaryINR+M.passiveINR;
  const items=[...BCATS.map(c=>({k:c,grp:'spend',n:binfo(c).n,e:binfo(c).e,c:binfo(c).c,v:+S.budgets[c]||0,act:M.cm[c],sug:M.bs[c].sug,edit:`budgets||${c}|num`})),
    ...Object.entries(XB).map(([k,x])=>({k,grp:'extra',n:x.n,e:x.e,c:x.c,d:x.d,v:+(S.alloc||{})[k]||0,edit:`alloc||${k}|num`}))];
  const alloc=items.reduce((a,i)=>a+i.v,0);
  return{income,items,alloc,left:income-alloc,spend:items.filter(i=>i.grp==='spend').reduce((a,i)=>a+i.v,0)};
}
function sankey(D){
  const W=680,gap=8,rows=D.items.filter(i=>i.v>0);if(D.left>0)rows.push({n:'Unallocated',e:'⬜',c:'#64748b',v:D.left});
  const tot=Math.max(1,rows.reduce((a,r)=>a+r.v,0)),base=300;
  rows.forEach(r=>{r.rh=Math.max(4,r.v/tot*base);r.slot=Math.max(38,r.rh)});
  const H=rows.reduce((a,r)=>a+r.slot,0)+gap*(rows.length-1);
  const x1=150,x2=430,mid=(x1+x2)/2;let yl=0,ys=0;
  const bands=rows.map(r=>{const hl=r.v/tot*H,yr=ys+(r.slot-r.rh)/2,h=r.rh,cy=ys+r.slot/2;
    const p=`<path d="M${x1},${yl} C${mid},${yl} ${mid},${yr} ${x2},${yr} L${x2},${yr+h} C${mid},${yr+h} ${mid},${yl+hl} ${x1},${yl+hl} Z" fill="${r.c}" opacity=".38"><title>${esc(r.n)} ${inr(r.v)}</title></path>
    <rect x="${x2}" y="${yr}" width="14" height="${h}" rx="4" fill="${r.c}"/>
    <text x="${x2+24}" y="${cy-8}" fill="#eef0ff" font-size="14" font-weight="600" dominant-baseline="middle">${r.e} ${esc(r.n)}</text>
    <text x="${x2+24}" y="${cy+10}" fill="#8e92b4" font-size="12.5" dominant-baseline="middle">${inr(r.v)} · ${Math.round(r.v/Math.max(1,D.income)*100)}%</text>`;
    yl+=hl;ys+=r.slot+gap;return p}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible" role="img" aria-label="Income flow into allocation buckets">
  <defs><linearGradient id="inc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect x="${x1-16}" y="0" width="16" height="${H}" rx="5" fill="url(#inc)"/>
  <text x="${x1-26}" y="${H/2-10}" text-anchor="end" fill="#8e92b4" font-size="12" letter-spacing="1.5">INCOME</text>
  <text x="${x1-26}" y="${H/2+12}" text-anchor="end" fill="#eef0ff" font-size="18" font-weight="700">${inr(D.income)}</text>${bands}</svg>`;
}
V.allocate=()=>{
  const M=calc(),D=allocData(M);const inc=Math.max(1,D.income);
  const sv=+(S.alloc||{}).savings||0,gr=+(S.alloc||{}).growth||0;

  const lc=D.left<0?'r':D.left===0?'g':'y';
  const card=(i,ix)=>{const mx=Math.max(inc,i.v);const act=i.grp==='spend';const p=act&&i.v?i.act/i.v:0;
    return `<div class="card" style="--d:${4+ix}"><div class="between"><div class="flex"><div style="width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:${i.c}22">${i.e}</div><div><b>${esc(i.n)}</b><div class="mut xs">${act?'spending budget · shared with 🎯 Budget':esc(i.d)}</div></div></div><span class="tag" style="color:${i.c};border-color:${i.c}55">${Math.round(i.v/inc*100)}%</span></div>
    <div class="flex" style="margin:14px 0 6px;gap:10px"><input type="range" min="0" max="${Math.ceil(mx/100)*100}" step="100" value="${i.v}" data-edit="${i.edit}" data-live="lv_${i.k}" style="flex:1;accent-color:${i.c};padding:0;border:0;background:none;box-shadow:none"><input type="number" min="0" step="100" value="${i.v||''}" placeholder="0" data-edit="${i.edit}" style="width:110px;font-family:'Space Grotesk';font-weight:600"></div>
    <div class="between sm"><span class="num" id="lv_${i.k}" style="font-size:18px">${inr(i.v)}</span>${act?`<button class="btn sm ghost" data-act="usesug" data-c="${i.k}">Trend: ${inr(i.sug)}</button>`:''}</div>
    ${act?`<div style="margin-top:10px">${bar(p,pctColor(p))}</div><div class="mut xs" style="margin-top:6px">Actual this month: <b style="color:var(--txt)">${inr(i.act)}</b>${i.v?` · ${Math.round(p*100)}% used`:''}</div>`:
     i.k==='savings'?`<div class="verdict" style="margin-top:10px">🛟 +${M.survival?(i.v/M.survival).toFixed(2):'0'} months of runway every month</div>`:
     i.k==='growth'?`<div class="verdict" style="margin-top:10px">🌱 ${inr(i.v*12)} a year invested in your passive-income skills</div>`:
     `<div class="verdict" style="margin-top:10px">❤️ ${inr(i.v*12)} a year to family</div>`}
  </div>`};
  return `<header class="top"><div><div class="lbl">Give every rupee a job</div><h1>Budget <span class="gt">allocation</span></h1><p>Split your monthly income (salary + passive) into buckets. Spending buckets are the same budgets used in 🎯 Budget — change one, both update.</p></div>
  <div class="topr"><button class="btn" data-act="autoalloc">✨ Auto-allocate</button><button class="btn ghost" data-act="clearalloc">Reset extras</button></div></header>
  ${D.income<=0?`<div class="alerts"><div class="alert y"><span class="ic">💼</span><span class="t">Add your salary and passive income in Settings to allocate it.</span><button class="btn sm ghost" data-act="go" data-v="settings">Settings</button></div></div>`:''}
  <section class="card hero" style="--d:0">
    <div><div class="lbl">Monthly income · ${inr(M.salaryINR)} salary + ${inr(M.passiveINR)} passive</div>
      <div class="mega">${cnt(D.income)}</div>
      <div class="mut">Allocated <b style="color:var(--txt)">${inr(D.alloc)}</b> · <b class="${lc}">${D.left<0?inr(-D.left)+' over-allocated':D.left===0?'every rupee has a job ✓':inr(D.left)+' unallocated'}</b></div>
      <div class="week" style="height:20px">${D.items.filter(i=>i.v>0).map(i=>`<i style="width:${i.v/Math.max(inc,D.alloc)*100}%;background:${i.c}" title="${esc(i.n)} ${inr(i.v)}"></i>`).join('')}${D.left>0?`<i style="width:${D.left/inc*100}%;background:rgba(255,255,255,.08)"></i>`:''}</div>
      <div class="legend">${D.items.filter(i=>i.v>0).map(i=>`<span style="--k:${i.c}">${esc(i.n.split(' ')[0])} ${Math.round(i.v/inc*100)}%</span>`).join('')}</div></div>
    <div class="rings">
      <div style="text-align:center">${ring(D.spend/inc,`<b>${Math.round(D.spend/inc*100)}%</b><span>spending</span>`,'#f59e0b','#f472b6')}<div class="ringbox"><div class="cap">of income goes to living</div></div></div>
      <div style="text-align:center">${ring(sv/inc,`<b>${Math.round(sv/inc*100)}%</b><span>savings</span>`,'#a3e635','#34d399')}<div class="ringbox"><div class="cap">savings rate</div></div></div>
      <div style="text-align:center">${ring(rw12/24,`<b>${rw12.toFixed(1)}</b><span>months</span>`,'#fbbf24','#fb7185')}<div class="ringbox"><div class="cap">runway in 12 months (now ${M.runway.toFixed(1)})</div></div></div>
    </div>
  </section>
  <div class="card" style="--d:1;margin-bottom:16px"><h2>🌊 Where your income flows</h2>${D.income>0?sankey(D):'<div class="empty">Add income to see the flow.</div>'}</div>
  <div class="grid g4">
    <div class="card stat" style="--d:2"><div class="glow" style="background:#f59e0b"></div><div class="lbl">Survival budgets</div><div class="v num">${cnt(D.items.filter(i=>CATS[i.k]).reduce((a,i)=>a+i.v,0))}</div><div class="mut xs">vs ${inr(M.survival)} real survival cost</div></div>
    <div class="card stat" style="--d:3"><div class="glow" style="background:#a3e635"></div><div class="lbl">Saved per year</div><div class="v num">${cnt(sv*12)}</div><div class="mut xs">at this plan</div></div>
    <div class="card stat" style="--d:4"><div class="glow" style="background:#e879f9"></div><div class="lbl">Growth per year</div><div class="v num">${cnt(gr*12)}</div><div class="mut xs">toward passive income</div></div>
    <div class="card stat" style="--d:5"><div class="glow" style="background:#8b5cf6"></div><div class="lbl">Passive covers</div><div class="v num">${cnt(M.coverage*100,'pct')}</div><div class="mut xs">of survival cost today</div></div>
  </div>
  <div class="sec">Spending buckets</div><div class="grid g3">${D.items.filter(i=>i.grp==='spend').map(card).join('')}</div>
  <div class="sec">Future buckets</div><div class="grid g3">${D.items.filter(i=>i.grp==='extra').map((i,x)=>card(i,x+5)).join('')}</div>`;
};

/* ---------- actions ---------- */
function addExpense(o){const r=rate(o.cur);const e={id:uid(),date:o.date||today(),amt:+o.amt,cur:o.cur,rate:r,inr:+o.amt*r,cat:o.cat,note:o.note||''};if(S.settings.trip.on&&S.settings.trip.id)e.tripId=S.settings.trip.id;S.expenses.push(e);return e}
const A={
  go:t=>go(t.dataset.v),
  quick:t=>openQuick({cat:t.dataset.cat,date:t.dataset.date}),
  close:closeModal,
  qacur:t=>{QA.cur=t.dataset.v;renderModal()},
  qacat:t=>{QA.cat=t.dataset.v;renderModal()},
  qastate:t=>{QA.state=t.dataset.v;renderModal()},
  qasave:()=>{
    const a=+QA.amt;if(!a||a<=0)return toast('Enter an amount');if(!QA.cat)return toast('Pick a category');
    if(QA.cat==='lend'){if(!QA.person.trim())return toast('Who did you give it to?');const r=rate(QA.cur);S.friends.push({id:uid(),date:QA.date,person:QA.person.trim(),amt:a,cur:QA.cur,rate:r,inr:a*r,state:QA.state,due:QA.state==='toreturn'?QA.due:'',returned:[],note:QA.note});toast('🤝 Saved to Friends')}
    else{addExpense(QA);toast('✓ Logged '+money(a,QA.cur))}
    save();closeModal();render(false);
  },
  rvshift:t=>{RV.shift=t.dataset.v;if(RV.shift==='off')RV.work=0;else if(!RV.work)RV.work=+S.settings.workHours||10;render(false)},
  rvwork:t=>{RV.work=clamp(RV.work+(+t.dataset.v),0,24);render(false)},
  rvmood:t=>{RV.mood=+t.dataset.v;render(false)},
  rvmin:t=>{RV.mins[t.dataset.id]=Math.max(0,(+RV.mins[t.dataset.id]||0)+(+t.dataset.v));render(false)},
  tstart:t=>startTimer(t.dataset.v),
  tstop:()=>stopTimer(true),
  tdiscard:()=>{stopTimer(false);toast('Timer discarded');render(false)},
  tdel:t=>{const x=S.sessions.find(s=>s.id===t.dataset.id);S.sessions=S.sessions.filter(s=>s.id!==t.dataset.id);if(x)syncDay(x.date,x.task);save();render(false)},
  tuse:t=>{const x=S.tasks.find(y=>y.id===t.dataset.id);const v=+t.dataset.v;if(x.fix.active&&x.fix.type!=='none')x.fix.after=v;else x.min=v;save();toast('Estimate updated → '+v+' min/day');render(false)},
  rvsave:()=>{RV.auto=false;S.reviews[RV.date]={...RV};save();toast('🌙 Review saved — good night!');render(false)},
  delexp:t=>{S.expenses=S.expenses.filter(e=>e.id!==t.dataset.id);save();render(false)},
  fret:t=>{const f=S.friends.find(x=>x.id===t.dataset.id);const rem=remaining(f);if(rem>0)(f.returned=f.returned||[]).push({date:today(),inr:rem});f.state='returned';f.returnedDate=today();save();toast('✅ Marked returned');render(false)},
  fpart:t=>{MODAL={t:'partial',id:t.dataset.id};renderModal();document.getElementById('modal').classList.add('open')},
  psave:()=>{const f=S.friends.find(x=>x.id===MODAL.id);const v=+document.getElementById('pAmt').value;if(!v)return toast('Enter an amount');(f.returned=f.returned||[]).push({date:today(),inr:v*f.rate});if(remaining(f)<=0.5){f.state='returned';f.returnedDate=today()}save();closeModal();toast('Partial return saved');render(false)},
  fdate:t=>{MODAL={t:'date',id:t.dataset.id};renderModal();document.getElementById('modal').classList.add('open')},
  dsave:()=>{const f=S.friends.find(x=>x.id===MODAL.id);const v=document.getElementById('dDate').value;if(!v)return;f.due=v;f.state='toreturn';save();closeModal();toast('📅 Reminder set');render(false)},
  fstate:t=>{const f=S.friends.find(x=>x.id===t.dataset.id);f.state=t.dataset.v;f.writtenDate='';save();render(false)},
  fwrite:t=>{const f=S.friends.find(x=>x.id===t.dataset.id);f.state='written';f.writtenDate=today();save();toast('Written off — counted as unexpected');render(false)},
  delfriend:t=>{S.friends=S.friends.filter(f=>f.id!==t.dataset.id);save();render(false)},
  usesug:t=>{const M=calc();S.budgets[t.dataset.c]=M.bs[t.dataset.c].sug;snapBudget();save();render(false)},
  autoalloc:()=>{const M=calc();BCATS.forEach(c=>{if(!S.budgets[c])S.budgets[c]=M.bs[c].sug});snapBudget();const D=allocData(M);const left=Math.max(0,D.income-D.spend);S.alloc={savings:Math.floor(left*.5/100)*100,growth:Math.floor(left*.3/100)*100,family:Math.floor(left*.2/100)*100};save();toast('✨ Allocated: 50% savings · 30% growth · 20% family');render(false)},
  clearalloc:()=>{S.alloc={savings:0,family:0,growth:0};save();render(false)},
  applyall:()=>{const M=calc();BCATS.forEach(c=>S.budgets[c]=M.bs[c].sug);snapBudget();save();toast('✨ Budgets set from your trends');render(false)},
  addtask:()=>{S.tasks.push({id:uid(),name:'New task',cat:'home',min:20,feel:'neutral',fix:{type:'none',cost:0,after:20,active:false}});save();render(false);setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50)},
  deltask:t=>{S.tasks=S.tasks.filter(x=>x.id!==t.dataset.id);save();render(false)},
  feel:t=>{const x=S.tasks.find(y=>y.id===t.dataset.id);x.feel=t.dataset.v;save();render(false)},
  activate:t=>{const x=S.tasks.find(y=>y.id===t.dataset.id);x.fix.active=true;save();toast('⚡ '+x.name+' automated');render(false)},
  addbill:()=>{S.bills.push({id:uid(),name:'New bill',amt:0,cur:S.settings.defCur,dueDay:1,dueMonth:1,repeat:'monthly',warn:3,paid:{}});save();render(false)},
  delbill:t=>{S.bills=S.bills.filter(b=>b.id!==t.dataset.id);save();render(false)},
  billpay:t=>{const b=S.bills.find(x=>x.id===t.dataset.id);const n=billNext(b);const e=addExpense({amt:b.amt,cur:b.cur,cat:'home',note:'Bill: '+b.name,date:today()});e.bill=b.id;b.paid=b.paid||{};b.paid[n.key]={date:today(),eid:e.id};save();toast('🧾 '+b.name+' paid');render(false)},
  billunpay:t=>{const b=S.bills.find(x=>x.id===t.dataset.id);const p=b.paid[t.dataset.k];if(p&&p.eid)S.expenses=S.expenses.filter(e=>e.id!==p.eid);delete b.paid[t.dataset.k];save();render(false)},
  addpassive:()=>{S.passive.push({id:uid(),name:'Side income',amount:0,cur:'INR'});save();render(false)},
  delpassive:t=>{S.passive=S.passive.filter(p=>p.id!==t.dataset.id);save();render(false)},
  addcur:()=>{const c=document.getElementById('ncur').value.trim().toUpperCase(),r=+document.getElementById('nrate').value;if(!c||!r)return toast('Enter code and rate');S.rates[c]=r;save();render(false)},
  delcur:t=>{delete S.rates[t.dataset.v];save();render(false)},
  tripon:()=>{const c=document.getElementById('tcountry').value.trim(),cur=document.getElementById('tcur').value;if(!c)return toast('Which country?');const id=uid();S.trips.push({id,country:c,cur,start:today(),end:null});S.settings.trip={on:true,country:c,cur,id};save();toast('✈️ Have a great trip!');render(false)},
  tripoff:()=>{const tr=S.trips.find(x=>x.id===S.settings.trip.id);if(tr)tr.end=today();S.settings.trip={...S.settings.trip,on:false,id:null};save();toast('Welcome back 🏠');render(false)},
  notif:async()=>{try{await Notification.requestPermission()}catch(e){}render(false)},
  export:()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finauto-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('⬇ Backup downloaded')},
  import:()=>document.getElementById('imp').click(),
  demo:()=>{loadDemo();save();toast('✨ Demo data loaded');go('home')},
  reset:()=>{if(!RESETARM){RESETARM=true;render(false);setTimeout(()=>{RESETARM=false;if(VIEW==='settings')render(false)},4000);return}RESETARM=false;S=DEF();save();RV=null;toast('Everything erased');go('home')},
};
function snapBudget(){S.budgetHist[mk(today())]={...S.budgets}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal')return closeModal();
  const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});
document.addEventListener('input',e=>{
  const t=e.target;if(t.dataset.live){const el=document.getElementById(t.dataset.live);if(el)el.textContent=inr(+t.value)}if(t.dataset.qa){QA[t.dataset.qa]=t.value;if(t.dataset.qa==='amt'||t.dataset.qa==='cur'){const v=(+QA.amt||0)*rate(QA.cur);const el=document.getElementById('qaInr');if(el)el.innerHTML=QA.cur!=='INR'&&v?'≈ '+inr(v):'&nbsp;'}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal();if(e.key==='Enter'&&MODAL==='quick'&&e.target.tagName==='INPUT')A.qasave()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='rvDate'){rvLoad(t.value||today());return render(false)}
  if(t.id==='spm'){SPM=t.value;return render(false)}
  if(t.id==='imp'){const file=t.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{mergeIn(JSON.parse(r.result));save();toast('⬆ Imported & merged');go('home')}catch(err){toast('That file could not be read')}t.value=''};r.readAsText(file);return}
  if(!t.dataset.edit)return;
  const [coll,id,field,typ]=t.dataset.edit.split('|');
  let v=typ==='num'?(parseFloat(t.value)||0):typ==='bool'?t.checked:t.value;
  let obj=id?S[coll].find(x=>x.id===id):S[coll];if(!obj)return;
  const path=field.split('.');const last=path.pop();path.forEach(p=>obj=obj[p]);obj[last]=v;
  if(coll==='budgets')snapBudget();
  save();
  setTimeout(()=>{const a=document.activeElement;const key=a&&a.dataset?a.dataset.edit:null;const y=window.scrollY;render(false);window.scrollTo(0,y);if(key){const n=document.querySelector(`[data-edit="${key}"]`);if(n)n.focus()}},0);
});
function mergeIn(d){
  if(!d||typeof d!=='object')throw 0;
  ['passive','tasks','expenses','friends','bills','trips','sessions'].forEach(k=>{if(!Array.isArray(d[k]))return;const m=new Map(S[k].map(x=>[x.id,x]));d[k].forEach(x=>m.set(x.id,x));S[k]=[...m.values()]});
  ['reviews','rates','budgets','budgetHist','alloc'].forEach(k=>{if(d[k])S[k]={...S[k],...d[k]}});
  if(d.settings)S.settings={...S.settings,...d.settings};
  if(d.created&&d.created<S.created)S.created=d.created;
}

/* ---------- render / nav ---------- */
function navHTML(){return NAV.map(([k,ic,n])=>`<button class="nav ${VIEW===k?'on':''}" data-act="go" data-v="${k}"><span class="ic">${ic}</span>${n}</button>`).join('')}
function render(anim=true){
  ANIM=anim;gid=0;
  const m=document.getElementById('main');
  m.classList.toggle('anim',anim);
  m.innerHTML=`<div class="mob-logo"><div class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><b>FINAUTO</b></div>`+(S.timer&&VIEW!=='timer'?`<button class="tpill" data-act="go" data-v="timer"><span class="dot"></span>${esc(tName(S.timer.task))} <b class="tlive">${hms((Date.now()-S.timer.start)/1000)}</b></button>`:'')+V[VIEW]();
  document.getElementById('sidenav').innerHTML=navHTML();
  document.getElementById('botnav').innerHTML=navHTML();
  runCounters();
}
function go(v){VIEW=v;if(v==='review')RV=null;try{localStorage.setItem(KEY+'.view',v)}catch(e){}render(true);window.scrollTo({top:0,behavior:'smooth'})}

function notifyOnOpen(){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;const t=today();if(S.lastNotify===t)return;
  const al=alerts(calc()).filter(a=>a.notify);al.slice(0,4).forEach(a=>new Notification('FINAUTO',{body:a.notify,icon:'icon-192.png'}));S.lastNotify=t;save()}catch(e){}
}

    if(rnd()<.14)add(d,R(3,9),'KWD','outing','Dinner with friends');
    if(rnd()<.03)add(d,R(5,15),'KWD','gift','Gift');
    if(rnd()<.02)add(d,R(8,25),'KWD','repair','Phone repair');
    if(rnd()<.02)add(d,R(1500,4000),'INR','emergency','Family emergency');
  }
  S.bills=[{id:uid(),name:'Internet',amt:10,cur:'KWD',dueDay:5,dueMonth:1,repeat:'monthly',warn:3,paid:{}},{id:uid(),name:'Mobile recharge',amt:5,cur:'KWD',dueDay:parse(addDays(t,2)).getDate(),dueMonth:1,repeat:'monthly',warn:3,paid:{}},{id:uid(),name:'Home electricity (India)',amt:1800,cur:'INR',dueDay:20,dueMonth:1,repeat:'monthly',warn:4,paid:{}},{id:uid(),name:'Health insurance',amt:12000,cur:'INR',dueDay:15,dueMonth:3,repeat:'yearly',warn:10,paid:{}}];
  monthsBack(4).forEach((k,ix)=>S.bills.forEach(b=>{if(b.repeat==='yearly')return;const due=k+'-'+pad(Math.min(b.dueDay,dim(k)));if(due>t||(ix===3&&due>=addDays(t,-1)))return;const r=rate(b.cur);const id=uid();S.expenses.push({id,date:due,amt:b.amt,cur:b.cur,rate:r,inr:b.amt*r,cat:'home',note:'Bill: '+b.name,bill:b.id});b.paid[k]={date:due,eid:id}}));
  const r=rate('KWD');const lm=mk(addDays(t,-35));
  S.friends=[
    {id:uid(),date:addDays(t,-10),person:'Ravi',amt:20,cur:'KWD',rate:r,inr:20*r,state:'toreturn',due:addDays(t,3),returned:[],note:'Rent shortfall'},
    {id:uid(),date:addDays(t,-25),person:'Arjun',amt:50,cur:'KWD',rate:r,inr:50*r,state:'toreturn',due:addDays(t,-3),returned:[{date:addDays(t,-8),inr:15*r}],note:'Emergency transfer'},
    {id:uid(),date:addDays(t,-40),person:'Sameer',amt:5000,cur:'INR',rate:1,inr:5000,state:'unsure',due:'',returned:[],note:''},
    {id:uid(),date:addDays(t,-30),person:'Faisal',amt:15,cur:'KWD',rate:r,inr:15*r,state:'returned',due:addDays(t,-12),returnedDate:addDays(t,-12),returned:[{date:addDays(t,-12),inr:15*r}],note:''},
    {id:uid(),date:addDays(t,-70),person:'Kiran',amt:2000,cur:'INR',rate:1,inr:2000,state:'written',due:'',writtenDate:lm+'-10',returned:[],note:''}];
  const sh=['morning','morning','evening','evening','night','night','off'];
  for(let i=13;i>=0;i--){const d=addDays(t,-i),k=sh[(20-i)%7];S.reviews[d]={date:d,shift:k,work:k==='off'?0:10,mood:1+Math.min(4,Math.floor(R(2,5.2))),mins:Object.fromEntries(S.tasks.map(x=>[x.id,Math.max(0,Math.round(((x.fix.active?x.fix.after:x.min)*R(.7,1.3))/5)*5)]))}}
  const M=calc();BCATS.forEach(c=>S.budgets[c]=M.bs[c].sug);
  {const D=allocData(calc());const left=Math.max(0,D.income-D.spend);S.alloc={savings:Math.floor(left*.5/100)*100,growth:Math.floor(left*.3/100)*100,family:Math.floor(left*.2/100)*100}}
  pastMonths().concat(M.ck).forEach(k=>{const b={};BCATS.forEach(c=>b[c]=M.bs[c].sug);S.budgetHist[k]=b});

  RV=null;
